
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Misi Susun Huruf Hijaiyah</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<style>
* {
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

body {
  background:
    linear-gradient(rgba(4,25,35,.48), rgba(4,25,35,.65)),
    url("masjid-negara.jpg") center center / cover no-repeat fixed;
}

#app {
  height: 100dvh;
  width: 100%;
  padding: 12px;
  display: grid;
  grid-template-rows: auto 1fr auto;
  gap: 10px;
  color: white;
}

header {
  text-align: center;
  padding: 5px;
  text-shadow: 0 2px 5px #000;
}

header h1 {
  margin: 0;
  font-size: clamp(22px,3vw,36px);
  color: #ffe58a;
}

header p {
  margin: 5px 0 0;
  font-size: clamp(12px,1.5vw,16px);
}

.main {
  display: grid;
  grid-template-columns: 1.15fr .85fr;
  gap: 12px;
  min-height: 0;
}

.panel {
  background: rgba(255,255,255,.94);
  color: #173344;
  border: 3px solid #f5d77b;
  border-radius: 18px;
  padding: 12px;
  min-height: 0;
  box-shadow: 0 5px 18px rgba(0,0,0,.25);
}

.game-panel {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 12px;
  position: relative;
}

.section-title {
  font-weight: bold;
  font-size: clamp(15px,2vw,21px);
  text-align: center;
  color: #123e52;
}

.slots {
  display: flex;
  direction: rtl;
  justify-content: center;
  gap: clamp(4px,1vw,12px);
  flex-wrap: wrap;
}

.slot {
  width: clamp(42px,7vw,75px);
  height: clamp(52px,8vw,82px);
  border: 3px dashed #4b91a8;
  border-radius: 12px;
  background: #e8f6fa;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: clamp(27px,4vw,43px);
  color: #123e52;
  font-family: "Times New Roman",serif;
}

.slot.filled {
  border-style: solid;
  background: #d8f5d9;
}

.letters {
  display: flex;
  direction: rtl;
  justify-content: center;
  gap: clamp(5px,1vw,12px);
  flex-wrap: wrap;
}

.letter {
  width: clamp(42px,7vw,70px);
  height: clamp(48px,7vw,70px);
  display: flex;
  align-items: center;
  justify-content: center;
  background: #ffcf56;
  color: #253746;
  border: 2px solid #e3a92b;
  border-radius: 12px;
  font-size: clamp(27px,4vw,40px);
  font-family: "Times New Roman",serif;
  font-weight: bold;
  cursor: pointer;
  user-select: none;
  touch-action: manipulation;
  box-shadow: 0 3px 5px rgba(0,0,0,.15);
}

.letter.selected {
  background: #9be7a5;
  transform: scale(1.08);
  border-color: #168344;
}

.letter.used {
  opacity: .25;
  pointer-events: none;
}

#status {
  min-height: 24px;
  text-align: center;
  font-weight: bold;
  color: #145c37;
  font-size: clamp(13px,1.6vw,17px);
}

.camera-panel {
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-height: 0;
}

.camera-title {
  text-align: center;
  font-weight: bold;
  color: #123e52;
}

#cameraFrame {
  position: relative;
  width: 100%;
  flex: 1;
  min-height: 100px;
  overflow: hidden;
  border-radius: 13px;
  background: #102b38;
  border: 3px solid #4b91a8;
}

#cameraPreview, #cameraCanvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

#cameraCanvas {
  pointer-events: none;
}

.camera-hint {
  color: #315365;
  font-size: 12px;
  text-align: center;
}

.controls {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}

button {
  border: 0;
  border-radius: 10px;
  padding: 11px 16px;
  font-weight: bold;
  font-size: clamp(11px,1.3vw,14px);
  cursor: pointer;
  color: #173344;
  background: #ffdb70;
  box-shadow: 0 3px 6px rgba(0,0,0,.2);
}

button:active {
  transform: scale(.96);
}

button.primary {
  background: #54d58b;
}

button.danger {
  background: #ff9999;
}

/* CURSOR MAYA PADA PAPARAN PERMAINAN */

#gameCursor {
  position: fixed;
  width: 30px;
  height: 30px;
  border: 4px solid #ffcc00;
  background: rgba(255,204,0,.35);
  border-radius: 50%;
  z-index: 90;
  pointer-events: none;
  display: none;
  transform: translate(-50%,-50%);
  box-shadow: 0 0 12px rgba(255,204,0,.9);
}

#gameCursor.pinching {
  background: #00e676;
  border-color: #00e676;
  transform: translate(-50%,-50%) scale(.8);
}

#posterScreen {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 100;
  background: #071b28;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 12px;
  padding: 12px;
}

#posterScreen img {
  max-width: 96vw;
  max-height: 85dvh;
  object-fit: contain;
}

#posterScreen button {
  font-size: 16px;
  padding: 12px 25px;
}

@media (max-width:650px) {
  #app {
    padding: 7px;
    gap: 6px;
  }

  header {
    padding: 2px;
  }

  .main {
    grid-template-columns: 1fr;
    grid-template-rows: 1fr .85fr;
    gap: 7px;
  }

  .panel {
    padding: 7px;
    border-width: 2px;
    border-radius: 12px;
  }

  .game-panel {
    gap: 6px;
  }

  #cameraFrame {
    min-height: 0;
  }

  .camera-panel {
    gap: 4px;
  }

  .controls {
    gap: 5px;
  }

  button {
    padding: 8px 10px;
  }
}

@media (max-height:650px) {
  header h1 {
    font-size: 22px;
  }

  header p {
    font-size: 11px;
  }

  #app {
    padding: 6px;
    gap: 5px;
  }

  .panel {
    padding: 7px;
  }

  .game-panel {
    gap: 6px;
  }

  .slot {
    height: 48px;
  }

  .letter {
    height: 45px;
  }

  button {
    padding: 7px 10px;
  }
}
</style>
</head>

<body>

<div id="app">

  <header>
    <h1>🕌 MISI SUSUN HURUF HIJAIYAH</h1>
    <p>Susun huruf mengikut urutan yang betul untuk melengkapkan perkataan!</p>
  </header>

  <main class="main">

    <section class="panel game-panel">

      <div class="section-title">SUSUN HURUF DI SINI</div>

      <div class="slots" id="slots"></div>

      <div class="section-title">PILIH HURUF</div>

      <div class="letters" id="letters"></div>

      <div id="status">Mari kita mulakan permainan!</div>

    </section>

    <section class="panel camera-panel">

      <div class="camera-title">📷 KAMERA PEMAIN</div>

      <div id="cameraFrame">
        <video id="cameraPreview" autoplay playsinline muted></video>
        <canvas id="cameraCanvas"></canvas>
      </div>

      <div class="camera-hint">
        Gerakkan tangan untuk mengawal cursor pada ruang permainan.
        Cubit untuk memilih.
      </div>

    </section>

  </main>

  <footer class="controls">
    <button class="primary" onclick="startCamera()">▶ Mula Kamera</button>
    <button onclick="switchCamera()">🔄 Kamera Hadapan / Belakang</button>
    <button class="danger" onclick="stopCamera()">⏹ Henti Kamera</button>
    <button onclick="toggleTouch()">☝ Mod Sentuh</button>
    <button onclick="resetGame()">↻ Mula Semula</button>
  </footer>

</div>

<div id="gameCursor"></div>

<div id="posterScreen">
  <img src="poster.png" alt="Tahniah!">
  <button onclick="closePoster()">↻ Main Semula</button>
</div>

<script>
const sequence = ['ا','ل','ق','ر','ء','ا','ن'];

let selectedLetter = null;
let cameraStream = null;
let hands = null;
let cameraActive = false;
let touchMode = false;
let currentFacingMode = 'user';
let processing = false;
let lastPinch = false;
let lastPinchTime = 0;

const video = document.getElementById('cameraPreview');
const canvas = document.getElementById('cameraCanvas');
const ctx = canvas.getContext('2d');
const statusElement = document.getElementById('status');
const cursor = document.getElementById('gameCursor');

function createGame() {
  document.getElementById('slots').innerHTML = '';
  document.getElementById('letters').innerHTML = '';
  selectedLetter = null;

  sequence.forEach((letter,index) => {
    const slot = document.createElement('div');
    slot.className = 'slot';
    slot.dataset.index = index;
    slot.addEventListener('click', () => placeLetter(index));
    document.getElementById('slots').appendChild(slot);
  });

  sequence.forEach((letter,index) => {
    const tile = document.createElement('div');
    tile.className = 'letter';
    tile.textContent = letter;
    tile.dataset.index = index;

    tile.addEventListener('click', () => selectLetter(index));

    document.getElementById('letters').appendChild(tile);
  });

  statusElement.textContent = 'Pilih huruf mengikut urutan yang betul.';
  statusElement.style.color = '#145c37';
}

function selectLetter(index) {
  const tiles = document.querySelectorAll('.letter');
  const tile = tiles[index];

  if (!tile || tile.classList.contains('used')) return;

  tiles.forEach(item => item.classList.remove('selected'));
  tile.classList.add('selected');
  selectedLetter = index;

  statusElement.textContent = 'Sekarang pilih kotak jawapan.';
}

function placeLetter(slotIndex) {
  if (selectedLetter === null) return;

  const tiles = document.querySelectorAll('.letter');
  const slots = document.querySelectorAll('.slot');

  const tile = tiles[selectedLetter];
  const slot = slots[slotIndex];

  if (!tile || !slot || slot.textContent !== '') return;

  const correctLetter = sequence[slotIndex];
  const chosenLetter = tile.textContent;

  if (chosenLetter === correctLetter) {
    slot.textContent = chosenLetter;
    slot.classList.add('filled');
    tile.classList.add('used');
    tile.classList.remove('selected');

    statusElement.textContent = 'Betul! Bagus sekali! 🌟';
    statusElement.style.color = '#145c37';

    selectedLetter = null;

    if (document.querySelectorAll('.slot.filled').length === sequence.length) {
      statusElement.textContent = 'Tahniah! Anda berjaya!';
      setTimeout(showPoster,700);
    }
  } else {
    statusElement.textContent = 'Belum tepat. Cuba lagi!';
    statusElement.style.color = '#bd3333';

    tile.classList.remove('selected');
    selectedLetter = null;
  }
}

function resetGame() {
  document.getElementById('posterScreen').style.display = 'none';
  createGame();
}

function showPoster() {
  document.getElementById('posterScreen').style.display = 'flex';
}

function closePoster() {
  resetGame();
}

function toggleTouch() {
  touchMode = !touchMode;

  statusElement.textContent = touchMode
    ? 'Mod sentuh diaktifkan.'
    : 'Mod kamera diaktifkan.';

  if (touchMode) {
    cursor.style.display = 'none';
  }
}

function setCameraMirror() {
  video.style.transform = currentFacingMode === 'user'
    ? 'scaleX(-1)'
    : 'none';
}

async function startCamera() {
  try {
    await stopCamera();

    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: currentFacingMode },
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    });

    video.srcObject = cameraStream;
    await video.play();

    setCameraMirror();

    hands = new Hands({
      locateFile: file =>
        `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.65,
      minTrackingConfidence: 0.65
    });

    hands.onResults(onHandResults);

    cameraActive = true;
    processing = false;
    lastPinch = false;
    touchMode = false;

    statusElement.textContent = 'Kamera aktif. Gerakkan tangan dan cubit untuk memilih.';

    processCamera();

  } catch(error) {
    console.error(error);
    statusElement.textContent =
      'Kamera gagal dibuka. Benarkan akses kamera dan cuba lagi.';
  }
}

async function processCamera() {
  while (cameraActive && video.readyState >= 2 && hands) {
    if (!processing) {
      processing = true;

      try {
        await hands.send({image:video});
      } catch(error) {
        console.error(error);
      }

      processing = false;
    }

    await new Promise(resolve => requestAnimationFrame(resolve));
  }
}

function onHandResults(results) {
  canvas.width = video.videoWidth || 640;
  canvas.height = video.videoHeight || 480;

  ctx.clearRect(0,0,canvas.width,canvas.height);

  if (!results.multiHandLandmarks ||
      results.multiHandLandmarks.length === 0) {
    cursor.style.display = 'none';
    lastPinch = false;
    return;
  }

  const landmarks = results.multiHandLandmarks[0];

  const thumb = landmarks[4];
  const index = landmarks[8];

  const distance = Math.hypot(
    thumb.x-index.x,
    thumb.y-index.y
  );

  const isPinching = distance < 0.055;

  // X diterbalikkan untuk kamera hadapan.
  const x = currentFacingMode === 'user'
    ? 1-index.x
    : index.x;

  const y = index.y;

  // Pemetaan ke seluruh kawasan permainan.
  const gamePanel = document.querySelector('.game-panel');
  const rect = gamePanel.getBoundingClientRect();

  const screenX = rect.left + x*rect.width;
  const screenY = rect.top + y*rect.height;

  cursor.style.display = 'block';
  cursor.style.left = screenX+'px';
  cursor.style.top = screenY+'px';

  if (isPinching) {
    cursor.classList.add('pinching');
  } else {
    cursor.classList.remove('pinching');
  }

  const now = Date.now();

  // Satu tindakan bagi setiap cubitan.
  if (isPinching && !lastPinch &&
      now-lastPinchTime > 700) {

    handleHandPinch(screenX,screenY);
    lastPinchTime = now;
  }

  lastPinch = isPinching;
}

function handleHandPinch(screenX,screenY) {
  if (touchMode) return;

  const target = document.elementFromPoint(screenX,screenY);

  if (!target) return;

  const tile = target.closest('.letter');
  const slot = target.closest('.slot');

  if (tile && !tile.classList.contains('used')) {
    selectLetter(Number(tile.dataset.index));
  }
  else if (slot) {
    placeLetter(Number(slot.dataset.index));
  }
}

async function stopCamera() {
  cameraActive = false;
  processing = false;

  if (cameraStream) {
    cameraStream.getTracks().forEach(track => track.stop());
    cameraStream = null;
  }

  video.srcObject = null;

  if (hands) {
    try {
      await hands.close();
    } catch(error) {
      console.warn(error);
    }
    hands = null;
  }

  cursor.style.display = 'none';
  cursor.classList.remove('pinching');

  lastPinch = false;
  ctx.clearRect(0,0,canvas.width,canvas.height);
}

async function switchCamera() {
  currentFacingMode =
    currentFacingMode === 'user' ? 'environment' : 'user';

  setCameraMirror();

  if (cameraActive) {
    await startCamera();
  } else {
    statusElement.textContent =
      currentFacingMode === 'user'
        ? 'Kamera hadapan dipilih.'
        : 'Kamera belakang dipilih.';
  }
}

// Mula permainan.
createGame();
</script>

</body>
</html>
