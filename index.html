
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Misi Susun Huruf Hijaiyah</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<style>
* { box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

body {
  background:
    linear-gradient(rgba(4,25,35,.45), rgba(4,25,35,.58)),
    url("masjid-negara.png") center center / cover no-repeat fixed;
}

#app {
  width: 100%;
  height: 100dvh;
  padding: 10px;
  display: grid;
  grid-template-rows: auto 1fr auto;
  gap: 8px;
  color: white;
}

header {
  text-align: center;
  text-shadow: 0 2px 5px #000;
}

header h1 {
  margin: 0;
  color: #ffe58a;
  font-size: clamp(22px,3vw,36px);
}

header p {
  margin: 5px 0;
  font-size: clamp(12px,1.5vw,16px);
}

.main {
  display: grid;
  grid-template-columns: 1.15fr .85fr;
  gap: 12px;
  min-height: 0;
}

.panel {
  background: rgba(255,255,255,.95);
  color: #173344;
  border: 3px solid #f5d77b;
  border-radius: 18px;
  padding: 12px;
  min-height: 0;
  box-shadow: 0 5px 18px rgba(0,0,0,.25);
}

.game-panel {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 12px;
  position: relative;
}

.section-title {
  font-weight: bold;
  font-size: clamp(15px,2vw,21px);
  text-align: center;
  color: #123e52;
}

.slots, .letters {
  display: flex;
  direction: rtl;
  justify-content: center;
  align-items: center;
  gap: clamp(5px,1vw,12px);
  flex-wrap: wrap;
}

.slot {
  width: clamp(45px,7vw,75px);
  height: clamp(55px,8vw,82px);
  border: 3px dashed #4b91a8;
  border-radius: 12px;
  background: #e8f6fa;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: clamp(28px,4vw,43px);
  font-family: "Times New Roman",serif;
  color: #123e52;
  transition: .15s;
}

.slot.filled {
  border-style: solid;
  background: #d8f5d9;
}

.slot.hover-target {
  background: #b8f3c5;
  border: 4px solid #159447;
  transform: scale(1.08);
}

.letter {
  width: clamp(45px,7vw,70px);
  height: clamp(50px,7vw,70px);
  display: flex;
  align-items: center;
  justify-content: center;
  background: #ffcf56;
  color: #253746;
  border: 2px solid #e3a92b;
  border-radius: 12px;
  font-size: clamp(28px,4vw,40px);
  font-family: "Times New Roman",serif;
  font-weight: bold;
  cursor: pointer;
  user-select: none;
  transition: .15s;
}

.letter.selected {
  background: #9be7a5;
  border: 4px solid #168344;
  transform: scale(1.1);
}

.letter.used {
  opacity: .22;
  pointer-events: none;
}

.letter.hover-target {
  outline: 4px solid #168344;
  transform: scale(1.12);
}

#status {
  min-height: 25px;
  text-align: center;
  font-weight: bold;
  color: #145c37;
  font-size: clamp(13px,1.6vw,17px);
}

.camera-panel {
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-height: 0;
}

.camera-title {
  text-align: center;
  font-weight: bold;
  color: #123e52;
}

#cameraFrame {
  position: relative;
  width: 100%;
  flex: 1;
  min-height: 100px;
  overflow: hidden;
  border-radius: 13px;
  background: #102b38;
  border: 3px solid #4b91a8;
}

#cameraPreview, #cameraCanvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

#cameraCanvas {
  pointer-events: none;
}

.camera-hint {
  color: #315365;
  font-size: 12px;
  text-align: center;
}

.controls {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}

button {
  border: 0;
  border-radius: 10px;
  padding: 10px 15px;
  font-weight: bold;
  font-size: clamp(11px,1.3vw,14px);
  cursor: pointer;
  color: #173344;
  background: #ffdb70;
  box-shadow: 0 3px 6px rgba(0,0,0,.2);
}

button.primary { background: #54d58b; }
button.danger { background: #ff9999; }

/* CURSOR TANGAN */

#handCursor {
  position: fixed;
  z-index: 90;
  pointer-events: none;
  display: none;
  font-size: 42px;
  line-height: 1;
  transform: translate(-50%,-65%);
  filter: drop-shadow(0 3px 3px rgba(0,0,0,.5));
  transition: left .045s linear, top .045s linear;
}

#handCursor.pinching {
  font-size: 46px;
  transform: translate(-50%,-65%) scale(1.1);
}

#posterScreen {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 100;
  background: #071b28;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 12px;
  padding: 12px;
}

#posterScreen img {
  max-width: 96vw;
  max-height: 85dvh;
  object-fit: contain;
}

#posterScreen button {
  font-size: 16px;
  padding: 12px 25px;
}

@media(max-width:650px) {
  #app { padding: 6px; gap: 5px; }

  .main {
    grid-template-columns: 1fr;
    grid-template-rows: 1fr .85fr;
    gap: 6px;
  }

  .panel { padding: 7px; border-width: 2px; }
  .game-panel { gap: 6px; }
  #cameraFrame { min-height: 0; }
  button { padding: 7px 9px; }
  .controls { gap: 5px; }
}

@media(max-height:650px) {
  #app { padding: 5px; gap: 5px; }
  header h1 { font-size: 22px; }
  header p { font-size: 11px; }
  .game-panel { gap: 6px; }
  .slot { height: 48px; }
  .letter { height: 45px; }
  button { padding: 7px 9px; }
}
</style>
</head>

<body>

<div id="app">

  <header>
    <h1>🕌 MISI SUSUN HURUF HIJAIYAH</h1>
    <p>Gunakan tangan untuk menyusun huruf mengikut urutan yang betul!</p>
  </header>

  <main class="main">

    <section class="panel game-panel" id="gamePanel">

      <div class="section-title">SUSUN HURUF DI SINI</div>
      <div class="slots" id="slots"></div>

      <div class="section-title">PILIH HURUF</div>
      <div class="letters" id="letters"></div>

      <div id="status">Mari kita mulakan permainan!</div>

    </section>

    <section class="panel camera-panel">

      <div class="camera-title">📷 KAMERA PEMAIN</div>

      <div id="cameraFrame">
        <video id="cameraPreview" autoplay playsinline muted></video>
        <canvas id="cameraCanvas"></canvas>
      </div>

      <div class="camera-hint">
        🖐️ Buka tangan untuk gerakkan cursor.
        🤏 Cubit untuk memilih.
      </div>

    </section>

  </main>

  <footer class="controls">
    <button class="primary" onclick="startCamera()">▶ Mula Kamera</button>
    <button onclick="switchCamera()">🔄 Tukar Kamera</button>
    <button class="danger" onclick="stopCamera()">⏹ Henti Kamera</button>
    <button onclick="toggleTouch()">☝ Mod Sentuh</button>
    <button onclick="resetGame()">↻ Mula Semula</button>
  </footer>

</div>

<div id="handCursor">🖐️</div>

<div id="posterScreen">
  <img src="poster.png" alt="Tahniah!">
  <button onclick="closePoster()">↻ Main Semula</button>
</div>

<script>
const sequence = ['ا','ل','ق','ر','ء','ا','ن'];

let selectedLetter = null;
let cameraStream = null;
let hands = null;
let cameraActive = false;
let touchMode = false;
let currentFacingMode = 'user';
let processing = false;

let isPinching = false;
let lastPinch = false;
let lastPinchTime = 0;

let smoothX = null;
let smoothY = null;
let activeTarget = null;

const video = document.getElementById('cameraPreview');
const canvas = document.getElementById('cameraCanvas');
const ctx = canvas.getContext('2d');
const statusElement = document.getElementById('status');
const cursor = document.getElementById('handCursor');
const gamePanel = document.getElementById('gamePanel');

function createGame() {
  document.getElementById('slots').innerHTML = '';
  document.getElementById('letters').innerHTML = '';

  selectedLetter = null;
  activeTarget = null;

  sequence.forEach((letter,index) => {
    const slot = document.createElement('div');
    slot.className = 'slot';
    slot.dataset.index = index;
    slot.addEventListener('click', () => placeLetter(index));
    document.getElementById('slots').appendChild(slot);
  });

  sequence.forEach((letter,index) => {
    const tile = document.createElement('div');
    tile.className = 'letter';
    tile.textContent = letter;
    tile.dataset.index = index;
    tile.addEventListener('click', () => selectLetter(index));
    document.getElementById('letters').appendChild(tile);
  });

  statusElement.textContent = 'Pilih huruf mengikut urutan yang betul.';
  statusElement.style.color = '#145c37';
}

function selectLetter(index) {
  const tiles = document.querySelectorAll('.letter');
  const tile = tiles[index];

  if (!tile || tile.classList.contains('used')) return;

  tiles.forEach(item => item.classList.remove('selected'));
  tile.classList.add('selected');

  selectedLetter = index;
  statusElement.textContent = 'Bagus! Sekarang cubit pada kotak jawapan.';
  statusElement.style.color = '#145c37';
}

function placeLetter(slotIndex) {
  if (selectedLetter === null) {
    statusElement.textContent = 'Pilih huruf dahulu!';
    return;
  }

  const tiles = document.querySelectorAll('.letter');
  const slots = document.querySelectorAll('.slot');

  const tile = tiles[selectedLetter];
  const slot = slots[slotIndex];

  if (!tile || !slot || slot.textContent !== '') return;

  if (tile.textContent === sequence[slotIndex]) {
    slot.textContent = tile.textContent;
    slot.classList.add('filled');
    tile.classList.add('used');
    tile.classList.remove('selected');

    selectedLetter = null;

    statusElement.textContent = 'Betul! Bagus sekali! 🌟';
    statusElement.style.color = '#145c37';

    if (document.querySelectorAll('.slot.filled').length === sequence.length) {
      statusElement.textContent = 'Tahniah! Anda berjaya!';
      setTimeout(showPoster,700);
    }

  } else {
    statusElement.textContent = 'Belum tepat. Cuba lagi!';
    statusElement.style.color = '#bd3333';
    tile.classList.remove('selected');
    selectedLetter = null;
  }
}

/* Cari sasaran paling hampir dengan cursor */
function findNearestTarget(x,y) {
  const candidates = [
    ...document.querySelectorAll('.letter:not(.used)'),
    ...document.querySelectorAll('.slot:not(.filled)')
  ];

  let nearest = null;
  let nearestDistance = Infinity;

  candidates.forEach(element => {
    const rect = element.getBoundingClientRect();

    const centerX = rect.left + rect.width/2;
    const centerY = rect.top + rect.height/2;

    const distance = Math.hypot(x-centerX,y-centerY);

    if (distance < nearestDistance) {
      nearestDistance = distance;
      nearest = element;
    }
  });

  // Kawasan sasaran lebih besar untuk memudahkan murid.
  if (nearest && nearestDistance < 105) {
    return nearest;
  }

  return null;
}

function highlightTarget(target) {
  document.querySelectorAll('.hover-target').forEach(item => {
    item.classList.remove('hover-target');
  });

  if (target) {
    target.classList.add('hover-target');
  }
}

function performTargetAction(target) {
  if (!target) return;

  if (target.classList.contains('letter')) {
    selectLetter(Number(target.dataset.index));
  }
  else if (target.classList.contains('slot')) {
    placeLetter(Number(target.dataset.index));
  }
}

function onHandResults(results) {
  if (!results.multiHandLandmarks ||
      results.multiHandLandmarks.length === 0) {

    cursor.style.display = 'none';
    highlightTarget(null);
    activeTarget = null;
    lastPinch = false;
    smoothX = null;
    smoothY = null;
    return;
  }

  const landmarks = results.multiHandLandmarks[0];

  const thumb = landmarks[4];
  const index = landmarks[8];

  // Jarak cubitan. Nilai lebih besar = lebih mudah mencubit.
  const distance = Math.hypot(
    thumb.x-index.x,
    thumb.y-index.y
  );

  // Histeresis: mudah mencubit dan tidak mudah terputus.
  if (!isPinching && distance < 0.085) {
    isPinching = true;
  } else if (isPinching && distance > 0.13) {
    isPinching = false;
  }

  const x = currentFacingMode === 'user'
    ? 1-index.x
    : index.x;

  const y = index.y;

  const rect = gamePanel.getBoundingClientRect();

  // Pemetaan seluruh pergerakan tangan ke panel permainan.
  const targetX = rect.left + x*rect.width;
  const targetY = rect.top + y*rect.height;

  // Melicinkan pergerakan cursor.
  if (smoothX === null) {
    smoothX = targetX;
    smoothY = targetY;
  } else {
    smoothX += (targetX-smoothX)*0.4;
    smoothY += (targetY-smoothY)*0.4;
  }

  cursor.style.display = 'block';
  cursor.style.left = smoothX+'px';
  cursor.style.top = smoothY+'px';

  // Tukar gambar cursor mengikut gerakan tangan.
  if (isPinching) {
    cursor.textContent = '🤏';
    cursor.classList.add('pinching');
  } else {
    cursor.textContent = '🖐️';
    cursor.classList.remove('pinching');
  }

  // Kenal pasti sasaran paling hampir.
  const nearest = findNearestTarget(smoothX,smoothY);

  activeTarget = nearest;
  highlightTarget(nearest);

  // Tindakan hanya apabila mula mencubit.
  const now = Date.now();

  if (isPinching && !lastPinch &&
      now-lastPinchTime > 500) {

    if (nearest) {
      performTargetAction(nearest);
      lastPinchTime = now;
    } else {
      statusElement.textContent =
        'Gerakkan tangan lebih dekat dengan huruf atau kotak.';
    }
  }

  lastPinch = isPinching;
}

async function startCamera() {
  try {
    await stopCamera();

    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: {ideal:currentFacingMode},
        width: {ideal:1280},
        height: {ideal:720}
      },
      audio: false
    });

    video.srcObject = cameraStream;
    await video.play();

    video.style.transform =
      currentFacingMode === 'user' ? 'scaleX(-1)' : 'none';

    hands = new Hands({
      locateFile: file =>
        `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.65,
      minTrackingConfidence: 0.65
    });

    hands.onResults(onHandResults);

    cameraActive = true;
    processing = false;
    touchMode = false;
    isPinching = false;
    lastPinch = false;
    smoothX = null;
    smoothY = null;

    statusElement.textContent =
      'Kamera aktif! Gerakkan tangan dan cuba cubit.';

    processCamera();

  } catch(error) {
    console.error(error);
    statusElement.textContent =
      'Kamera gagal dibuka. Benarkan akses kamera dan cuba lagi.';
  }
}

async function processCamera() {
  while (cameraActive && video.readyState >= 2 && hands) {
    if (!processing) {
      processing = true;

      try {
        await hands.send({image:video});
      } catch(error) {
        console.error(error);
      }

      processing = false;
    }

    await new Promise(resolve => requestAnimationFrame(resolve));
  }
}

async function stopCamera() {
  cameraActive = false;
  processing = false;

  if (cameraStream) {
    cameraStream.getTracks().forEach(track => track.stop());
    cameraStream = null;
  }

  video.srcObject = null;

  if (hands) {
    try {
      await hands.close();
    } catch(error) {
      console.warn(error);
    }
    hands = null;
  }

  cursor.style.display = 'none';
  highlightTarget(null);

  ctx.clearRect(0,0,canvas.width,canvas.height);

  isPinching = false;
  lastPinch = false;
  smoothX = null;
  smoothY = null;
}

async function switchCamera() {
  currentFacingMode =
    currentFacingMode === 'user' ? 'environment' : 'user';

  if (cameraActive) {
    await startCamera();
  } else {
    video.style.transform =
      currentFacingMode === 'user' ? 'scaleX(-1)' : 'none';

    statusElement.textContent =
      currentFacingMode === 'user'
        ? 'Kamera hadapan dipilih.'
        : 'Kamera belakang dipilih.';
  }
}

function toggleTouch() {
  touchMode = !touchMode;

  cursor.style.display = 'none';

  statusElement.textContent = touchMode
    ? 'Mod sentuh aktif. Sentuh huruf dan kotak jawapan.'
    : 'Mod kamera aktif.';
}

function resetGame() {
  document.getElementById('posterScreen').style.display = 'none';
  createGame();
}

function showPoster() {
  document.getElementById('posterScreen').style.display = 'flex';
}

function closePoster() {
  resetGame();
}

createGame();
</script>

</body>
</html>
