
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Misi Susun Huruf Hijaiyah</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 18px;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #e0f7fa, #fff9c4);
  color: #174b43;
  text-align: center;
  overflow-x: hidden;
}

h1 {
  margin: 8px 0;
  font-size: clamp(25px, 4vw, 42px);
  color: #087f5b;
}

.subtitle {
  margin: 8px auto 20px;
  font-size: 17px;
}

#game {
  width: min(100%, 1000px);
  margin: auto;
}

.section-title {
  font-weight: bold;
  font-size: 20px;
  margin: 16px 0 12px;
}

#interactionArea {
  width: 100%;
  padding: 18px 10px;
  background: rgba(255,255,255,.75);
  border: 3px dashed #80cbc4;
  border-radius: 22px;
}

#answerSlots,
#letterBank {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  direction: rtl;
  min-height: 85px;
}

.slot {
  width: clamp(48px, 9vw, 78px);
  height: clamp(58px, 10vw, 88px);
  border: 3px dashed #80a9a2;
  border-radius: 13px;
  background: #eaf8f5;
  display: flex;
  justify-content: center;
  align-items: center;
}

.slot.filled {
  border-style: solid;
  border-color: #15966d;
  background: #d9f8e9;
}

.letter-card {
  width: clamp(48px, 9vw, 78px);
  height: clamp(58px, 10vw, 88px);
  border-radius: 13px;
  background: white;
  border: 3px solid #16a085;
  box-shadow: 0 4px 8px rgba(0,0,0,.12);
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: clamp(32px, 6vw, 48px);
  color: #174b43;
  cursor: grab;
  user-select: none;
  touch-action: none;
}

.letter-card.dragging {
  position: fixed !important;
  z-index: 10000 !important;
  pointer-events: none !important;
  margin: 0 !important;
  transform: translate(-50%, -50%);
  box-shadow: 0 10px 25px rgba(0,0,0,.3);
}

#cameraSection {
  width: min(100%, 650px);
  margin: 22px auto 0;
  padding: 14px;
  background: white;
  border-radius: 22px;
  box-shadow: 0 5px 18px rgba(0,0,0,.12);
}

.camera-heading {
  font-weight: bold;
  font-size: 19px;
  margin-bottom: 10px;
}

#cameraFrame {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #172b2b;
  border-radius: 16px;
  overflow: hidden;
  position: relative;
}

#cameraVideo { display: none; }

#cameraPreview {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transform: none;
}

#cameraPlaceholder {
  position: absolute;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;
  padding: 20px;
  font-size: 16px;
}

#cameraStatus {
  margin-top: 12px;
  padding: 11px;
  background: #edf7f5;
  border-radius: 12px;
  font-weight: bold;
  color: #176b57;
  min-height: 42px;
}

#cursor {
  position: fixed;
  z-index: 20000;
  width: 25px;
  height: 25px;
  border: 4px solid #2196f3;
  background: rgba(33,150,243,.25);
  border-radius: 50%;
  pointer-events: none;
  display: none;
  transform: translate(-50%, -50%);
}

#cursor.pinching {
  border-color: #ffc107;
  background: rgba(255,193,7,.45);
  transform: translate(-50%, -50%) scale(1.25);
}

#cursor.dragging {
  border-color: #00c853;
  background: rgba(0,200,83,.4);
  transform: translate(-50%, -50%) scale(1.35);
}

button {
  border: none;
  border-radius: 12px;
  padding: 13px 20px;
  margin: 7px 4px;
  background: #078b65;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled { opacity: .5; }

#touchMode { background: #1976d2; }
#restartButton { background: #f57c00; }

/* POSTER FULLSCREEN */
#winScreen {
  display: none;
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  z-index: 30000;
  background: #000;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  overflow: hidden;
  padding: 0;
}

#winScreen img {
  width: 100%;
  height: 100%;
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  border-radius: 0;
}

#winScreen h2 { display: none; }

#winScreen button {
  position: absolute;
  bottom: 20px;
  right: 20px;
  z-index: 30001;
  opacity: .85;
}

@media(max-width:600px) {
  body { padding: 10px; }
  #interactionArea { padding: 12px 5px; }
  #answerSlots, #letterBank { gap: 6px; }
  #cameraSection { padding: 10px; }
}
</style>
</head>

<body>

<h1>🌟 Misi Susun Huruf Hijaiyah 🌟</h1>
<p class="subtitle">Susun huruf mengikut urutan yang betul untuk melengkapkan misi!</p>

<div id="game">

  <div id="interactionArea">
    <div class="section-title">1. Susun huruf di ruang jawapan</div>
    <div id="answerSlots"></div>

    <div class="section-title">2. Pilih huruf yang betul</div>
    <div id="letterBank"></div>
  </div>

  <div id="cameraSection">
    <div class="camera-heading">📷 Kamera Pengesan Jari</div>

    <div id="cameraFrame">
      <video id="cameraVideo" autoplay playsinline muted></video>
      <canvas id="cameraPreview"></canvas>
      <div id="cameraPlaceholder">
        Tekan butang “Aktifkan Kamera” untuk mula
      </div>
    </div>

    <div id="cameraStatus">Kamera belum diaktifkan</div>

    <button id="startCamera">📷 Aktifkan Kamera</button>
    <button id="stopCamera" disabled>Matikan Kamera</button>
    <button id="touchMode">🖐️ Mod Skrin Sentuh</button>
  </div>

  <button id="restartButton">↻ Mula Semula</button>
</div>

<div id="cursor"></div>

<div id="winScreen">
  <h2>TAHNIAH!</h2>
  <img src="./poster.png" alt="Poster Tahniah" id="posterImage">
  <button onclick="restartGame()">↻ Main Semula</button>
</div>

<script>
/* =========================================
   TETAPAN
========================================= */

const targetLetters = ['ا','ل','ق','ر','ء','ا','ن'];

const interactionArea = document.getElementById('interactionArea');
const answerSlots = document.getElementById('answerSlots');
const letterBank = document.getElementById('letterBank');

const video = document.getElementById('cameraVideo');
const preview = document.getElementById('cameraPreview');
const previewCtx = preview.getContext('2d');

const statusBox = document.getElementById('cameraStatus');
const placeholder = document.getElementById('cameraPlaceholder');
const cursor = document.getElementById('cursor');

const startButton = document.getElementById('startCamera');
const stopButton = document.getElementById('stopCamera');

let currentDrag = null;
let cameraStream = null;
let hands = null;

let cameraActive = false;
let cameraBusy = false;
let pinchState = false;
let touchMode = false;

let pinchFrames = 0;
let releaseFrames = 0;
let lostFrames = 0;

let smoothedRatio = null;
let smoothX = null;
let smoothY = null;

const PINCH_START = 0.30;
const PINCH_RELEASE = 0.43;
const SMOOTHING = 0.35;

/* =========================================
   BINA PERMAINAN
========================================= */

function createGame() {
  answerSlots.innerHTML = '';
  letterBank.innerHTML = '';

  targetLetters.forEach((letter, index) => {
    const slot = document.createElement('div');
    slot.className = 'slot';
    slot.dataset.index = index;
    answerSlots.appendChild(slot);
  });

  const letters = targetLetters.map((letter, index) => ({
    letter,
    index
  }));

  letters.sort(() => Math.random() - 0.5);

  letters.forEach(item => {
    const card = document.createElement('div');
    card.className = 'letter-card';
    card.textContent = item.letter;
    card.dataset.letter = item.letter;
    card.dataset.index = item.index;

    addTouchEvents(card);
    letterBank.appendChild(card);
  });
}

/* =========================================
   MOD SENTUH
========================================= */

function addTouchEvents(card) {
  card.addEventListener('pointerdown', event => {
    if (cameraActive && !touchMode) return;

    event.preventDefault();
    startDrag(card, event.clientX, event.clientY);
  });
}

document.addEventListener('pointermove', event => {
  if (!currentDrag) return;

  if (touchMode || event.pointerType === 'touch') {
    moveDrag(event.clientX, event.clientY);
  }
});

document.addEventListener('pointerup', event => {
  if (!currentDrag) return;

  if (touchMode || event.pointerType === 'touch') {
    finishDrag(event.clientX, event.clientY);
  }
});

/* =========================================
   SISTEM SERET HURUF
========================================= */

function startDrag(card, x, y) {
  if (currentDrag) return;

  const parent = card.parentElement;
  const nextSibling = card.nextSibling;

  if (parent.classList.contains('slot')) {
    parent.classList.remove('filled');
  }

  const rect = card.getBoundingClientRect();

  currentDrag = {
    card,
    parent,
    nextSibling,
    width: rect.width,
    height: rect.height
  };

  document.body.appendChild(card);

  card.classList.add('dragging');
  card.style.width = rect.width + 'px';
  card.style.height = rect.height + 'px';

  moveDrag(x, y);
}

function moveDrag(x, y) {
  if (!currentDrag) return;

  const card = currentDrag.card;
  card.style.left = x + 'px';
  card.style.top = y + 'px';

  cursor.style.left = x + 'px';
  cursor.style.top = y + 'px';
}

function finishDrag(x, y) {
  if (!currentDrag) return;

  const drag = currentDrag;
  const card = drag.card;

  const target = document.elementFromPoint(x, y);
  const slot = target ? target.closest('.slot') : null;

  card.classList.remove('dragging');
  card.style.left = '';
  card.style.top = '';
  card.style.width = '';
  card.style.height = '';

  currentDrag = null;

  if (slot && slot.children.length === 0) {
    const expectedIndex = Number(slot.dataset.index);
    const actualLetter = card.dataset.letter;
    const expectedLetter = targetLetters[expectedIndex];

    if (actualLetter === expectedLetter) {
      slot.appendChild(card);
      slot.classList.add('filled');
      playSound(true);

      if (allCompleted()) {
        setTimeout(showWinner, 500);
      }
      return;
    }
  }

  restoreCard(drag);
  playSound(false);
}

function restoreCard(drag) {
  if (drag.nextSibling && drag.nextSibling.parentElement === drag.parent) {
    drag.parent.insertBefore(drag.card, drag.nextSibling);
  } else {
    drag.parent.appendChild(drag.card);
  }

  if (drag.parent.classList.contains('slot')) {
    drag.parent.classList.add('filled');
  }
}

/* =========================================
   SEMAK JAWAPAN
========================================= */

function allCompleted() {
  return [...answerSlots.children].every(
    slot => slot.children.length > 0
  );
}

/* =========================================
   AUDIO
========================================= */

function playSound(correct) {
  try {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    const audio = new AudioContextClass();

    const oscillator = audio.createOscillator();
    const gain = audio.createGain();

    oscillator.connect(gain);
    gain.connect(audio.destination);

    oscillator.frequency.value = correct ? 750 : 220;
    oscillator.type = 'sine';

    gain.gain.setValueAtTime(0.15, audio.currentTime);
    gain.gain.exponentialRampToValueAtTime(
      0.001,
      audio.currentTime + 0.2
    );

    oscillator.start();
    oscillator.stop(audio.currentTime + 0.2);
  } catch (error) {}
}

/* =========================================
   POSTER FULLSCREEN
========================================= */

async function showWinner() {
  stopCamera();

  const winScreen = document.getElementById('winScreen');
  winScreen.style.display = 'flex';

  try {
    if (!document.fullscreenElement) {
      await winScreen.requestFullscreen();
    }
  } catch (error) {
    console.log('Fullscreen tidak disokong:', error);
  }
}

async function restartGame() {
  if (document.fullscreenElement) {
    try {
      await document.exitFullscreen();
    } catch (error) {}
  }

  document.getElementById('winScreen').style.display = 'none';
  restartGameContent();
}

function restartGameContent() {
  stopCamera();
  currentDrag = null;
  cursor.style.display = 'none';
  createGame();
  touchMode = false;
  setStatus('Permainan dimulakan semula.');
}

/* =========================================
   KURSOR
========================================= */

function updateCursor(x, y, mode) {
  cursor.style.display = 'block';
  cursor.style.left = x + 'px';
  cursor.style.top = y + 'px';

  cursor.classList.remove('pinching', 'dragging');

  if (mode === 'pinch') cursor.classList.add('pinching');
  if (mode === 'drag') cursor.classList.add('dragging');
}

/*
  PENTING:
  Kamera dan koordinat tangan tidak dimirror.
  Kedua-duanya menggunakan koordinat X asal.
*/

function mapHandToGame(indexX, indexY) {
  const rect = interactionArea.getBoundingClientRect();

  const x = rect.left + indexX * rect.width;
  const y = rect.top + indexY * rect.height;

  return {x, y};
}

function distance(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

function setStatus(message, mode = 'normal') {
  let color = '#176b57';

  if (mode === 'pinch') color = '#bd8300';
  if (mode === 'drag') color = '#0879c9';

  statusBox.style.color = color;
  statusBox.textContent = message;
}

/* =========================================
   MEDIAPIPE - PAPARAN TANPA MIRROR
========================================= */

function onHandResults(results) {
  if (!cameraActive) return;

  previewCtx.clearRect(0, 0, preview.width, preview.height);

  if (results.image) {
    // Tiada translate atau scale(-1,1).
    // Imej dipaparkan mengikut orientasi asal.
    previewCtx.drawImage(
      results.image,
      0,
      0,
      preview.width,
      preview.height
    );
  }

  const handsFound = results.multiHandLandmarks;

  if (!handsFound || handsFound.length === 0) {
    lostFrames++;

    if (lostFrames > 8) {
      pinchFrames = 0;
      releaseFrames = 0;
      pinchState = false;
      smoothedRatio = null;

      if (currentDrag) {
        const drag = currentDrag;
        currentDrag = null;

        drag.card.classList.remove('dragging');
        drag.card.style.left = '';
        drag.card.style.top = '';
        drag.card.style.width = '';
        drag.card.style.height = '';

        restoreCard(drag);
      }

      cursor.style.display = 'none';
      setStatus('Tangan tidak dikesan. Tunjukkan tangan di hadapan kamera.');
    }

    return;
  }

  lostFrames = 0;

  const landmarks = handsFound[0];

  const thumb = landmarks[4];
  const index = landmarks[8];

  const palmWidth = distance(landmarks[5], landmarks[17]);
  const palmLength = distance(landmarks[0], landmarks[9]);

  const palmSize = Math.max(
    (palmWidth + palmLength) / 2,
    0.001
  );

  const pinchDistance = distance(thumb, index);
  const ratio = pinchDistance / palmSize;

  if (smoothedRatio === null) {
    smoothedRatio = ratio;
  } else {
    smoothedRatio =
      smoothedRatio * (1 - SMOOTHING) +
      ratio * SMOOTHING;
  }

  const position = mapHandToGame(index.x, index.y);

  if (smoothX === null) {
    smoothX = position.x;
    smoothY = position.y;
  } else {
    smoothX = smoothX * 0.65 + position.x * 0.35;
    smoothY = smoothY * 0.65 + position.y * 0.35;
  }

  const x = smoothX;
  const y = smoothY;

  if (smoothedRatio < PINCH_START) {
    pinchFrames++;
    releaseFrames = 0;
  } else if (smoothedRatio > PINCH_RELEASE) {
    releaseFrames++;
    pinchFrames = 0;
  } else {
    pinchFrames = 0;
    releaseFrames = 0;
  }

  if (!pinchState && pinchFrames >= 2) {
    pinchState = true;

    if (!currentDrag) {
      const element = document.elementFromPoint(x, y);
      const card = element ? element.closest('.letter-card') : null;

      if (card && !card.classList.contains('dragging')) {
        startDrag(card, x, y);
      }
    }
  }

  if (pinchState) {
    if (currentDrag) {
      moveDrag(x, y);
      updateCursor(x, y, 'drag');
      setStatus('🟦 Huruf sedang dipegang! Gerakkan ke ruang jawapan.', 'drag');
    } else {
      updateCursor(x, y, 'pinch');
      setStatus('🟡 Cubitan dikesan. Halakan jari pada huruf.', 'pinch');
    }
  } else {
    updateCursor(x, y, 'normal');
    setStatus('🟢 Tangan dikesan. Cubit ibu jari dan telunjuk.');
  }

  if (pinchState && releaseFrames >= 3) {
    pinchState = false;
    pinchFrames = 0;
    releaseFrames = 0;

    if (currentDrag) {
      finishDrag(x, y);
    }

    updateCursor(x, y, 'normal');
    setStatus('🟢 Tangan dikesan. Cubit untuk pilih huruf.');
  }
}

/* =========================================
   PEMPROSESAN IMEJ
========================================= */

const processingCanvas = document.createElement('canvas');
const processingCtx = processingCanvas.getContext('2d');

function processFrame() {
  if (!cameraActive || !hands || cameraBusy) return;

  if (video.readyState < 2) {
    requestAnimationFrame(processFrame);
    return;
  }

  cameraBusy = true;

  try {
    const width = video.videoWidth;
    const height = video.videoHeight;

    if (!width || !height) {
      cameraBusy = false;
      requestAnimationFrame(processFrame);
      return;
    }

    preview.width = width;
    preview.height = height;

    processingCanvas.width = width;
    processingCanvas.height = height;

    // Tingkatkan kecerahan dan kontras untuk MediaPipe.
    // Tiada transformasi mirror.
    processingCtx.filter = 'brightness(1.12) contrast(1.12)';
    processingCtx.drawImage(video, 0, 0, width, height);

    hands.send({image: processingCanvas})
      .catch(error => {
        console.error('Ralat MediaPipe:', error);
      })
      .finally(() => {
        cameraBusy = false;

        if (cameraActive) {
          requestAnimationFrame(processFrame);
        }
      });

  } catch (error) {
    console.error(error);
    cameraBusy = false;

    if (cameraActive) {
      requestAnimationFrame(processFrame);
    }
  }
}

/* =========================================
   AKTIFKAN KAMERA
========================================= */

async function startCamera() {
  try {
    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {
      throw new Error('Gunakan HTTPS untuk mengakses kamera.');
    }

    setStatus('Sedang mengaktifkan kamera...');

    cameraStream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: 'user',
        width: {ideal: 1280},
        height: {ideal: 720},
        frameRate: {ideal: 30}
      }
    });

    video.srcObject = cameraStream;
    await video.play();

    hands = new Hands({
      locateFile: file =>
        `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.45,
      minTrackingConfidence: 0.45
    });

    hands.onResults(onHandResults);

    cameraActive = true;
    touchMode = false;

    placeholder.style.display = 'none';

    startButton.disabled = true;
    stopButton.disabled = false;

    pinchState = false;
    pinchFrames = 0;
    releaseFrames = 0;
    lostFrames = 0;

    smoothedRatio = null;
    smoothX = null;
    smoothY = null;

    setStatus('Kamera aktif. Tunjukkan tangan di hadapan kamera.');

    requestAnimationFrame(processFrame);

  } catch (error) {
    console.error(error);

    setStatus('Kamera gagal diaktifkan. Semak kebenaran kamera dan cuba semula.');

    stopCamera();
  }
}

/* =========================================
   MATIKAN KAMERA
========================================= */

function stopCamera() {
  cameraActive = false;
  cameraBusy = false;

  if (cameraStream) {
    cameraStream.getTracks().forEach(track => track.stop());
    cameraStream = null;
  }

  video.srcObject = null;

  if (hands) {
    try {
      hands.close();
    } catch (error) {}

    hands = null;
  }

  startButton.disabled = false;
  stopButton.disabled = true;

  placeholder.style.display = 'flex';
  cursor.style.display = 'none';

  pinchState = false;
  pinchFrames = 0;
  releaseFrames = 0;
  lostFrames = 0;

  smoothedRatio = null;
  smoothX = null;
  smoothY = null;

  setStatus('Kamera dimatikan.');
}

/* =========================================
   MOD SKRIN SENTUH
========================================= */

document.getElementById('touchMode').addEventListener('click', () => {
  stopCamera();
  touchMode = true;

  setStatus('Mod skrin sentuh aktif. Seret huruf ke ruang jawapan.');
});

startButton.addEventListener('click', startCamera);
stopButton.addEventListener('click', stopCamera);

document.getElementById('restartButton')
  .addEventListener('click', restartGame);

createGame();

</script>
</body>
</html>
